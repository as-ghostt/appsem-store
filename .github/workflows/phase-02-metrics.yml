name: "Fase 2 - API y seguridad de métricas"
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "server/**"
      - "functions/**"
      - "src/services/**"
      - "src/pages/AppDetails.jsx"
      - "tests/**"
      - "package.json"
      - "vercel.json"
      - ".github/workflows/phase-02-metrics.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencias reproducibles sin credenciales de producción
        run: npm install --no-audit --no-fund
      - name: Auditoría de dependencias de producción (bloquear vulnerabilidades críticas)
        run: npm audit --omit=dev --audit-level=critical
      - name: Validar protección de configuración de despliegue
        run: npm run check:metrics-env
      - name: Confirmar Android SDK Build Tools para verificación APK
        shell: bash
        run: |
          set -euo pipefail
          signer="$(command -v apksigner || true)"
          if [ -z "$signer" ]; then
            for root in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk; do
              [ -n "$root" ] || continue
              signer="$(find "$root/build-tools" -type f -name apksigner -print -quit 2>/dev/null || true)"
              [ -n "$signer" ] && break
            done
          fi
          if [ -z "$signer" ]; then
            echo "::error::Android SDK Build Tools apksigner no está instalado en ubuntu-latest"
            exit 1
          fi
          "$signer" version
      - name: Casos de integridad del backend
        run: npm run test:security
      - name: Comprobar ESLint
        run: npm run lint
      - name: Compilar Vite sin ejecutar prerender remoto
        run: npx vite build
# No establece ni utiliza secrets Firebase, ni realiza deploy.
      - name: Comprobar ruta externa Cloudflare (GET sin escrituras)
        run: node scripts/check-live-metrics-route.mjs
      - name: Verificar rechazos de API Cloudflare sin escrituras
        run: node scripts/check-live-metrics-post-rejections.mjs
      - name: Auditar reglas Firestore REAL con SDK anónimo (solo lectura)
        run: node scripts/audit-live-firestore-rules.mjs
