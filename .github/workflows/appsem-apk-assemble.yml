name: Publicar APK de Appsem desde partes verificadas

on:
  repository_dispatch:
    types: [appsem_apk_assemble]

permissions:
  contents: write

concurrency:
  group: appsem-apk-${{ github.event.client_payload.release_id }}
  cancel-in-progress: false

jobs:
  publicar:
    if: ${{ github.event.client_payload.release_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      APPSEM_RELEASE_ID: ${{ github.event.client_payload.release_id }}
    steps:
      - name: Validar borrador, unir partes y verificar el APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import shutil
          import sys
          import urllib.request
          import zipfile

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          rid = os.environ['APPSEM_RELEASE_ID']
          if not re.fullmatch(r'[0-9]{1,16}', rid):
              raise ValueError('Release ID inválido')
          def api(path, accept='application/vnd.github+json'):
              request = urllib.request.Request(
                  'https://api.github.com' + path,
                  headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': accept,
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'appsem-apk-assembler'
                  }
              )
              return urllib.request.urlopen(request, timeout=90)
          with api(f'/repos/{repo}/releases/{rid}') as response:
              release = json.load(response)
          marker = 'APPSEM_CHUNKED_V1\n'
          body = release.get('body') or ''
          if not body.startswith(marker):
              raise ValueError('Release sin metadatos de subida Appsem')
          meta = json.loads(body[len(marker):].split('\n', 1)[0])
          file_name = meta.get('name', '')
          size = meta.get('size')
          count = meta.get('parts')
          chunk_size = 20 * 1024 * 1024
          if meta.get('appsemUpload') != 1 or not re.fullmatch(r'[a-zA-Z0-9][a-zA-Z0-9._-]{0,110}\.apk', file_name, re.I):
              raise ValueError('Metadatos del APK incorrectos')
          if not isinstance(size, int) or not 0 < size <= 1_900_000_000 or not isinstance(count, int) or count != (size + chunk_size - 1) // chunk_size:
              raise ValueError('Tamaño o cantidad de partes inválidos')
          if release.get('tag_name') != f'apk-{meta["slug"]}-v{meta["version"]}':
              raise ValueError('El tag de release no coincide')
          if not release.get('draft'):
              print('La release ya está publicada; salida idempotente.')
              with open(os.environ['GITHUB_ENV'], 'a') as env:
                  env.write('APPSEM_SKIP=1\n')
              sys.exit(0)
          with api(f'/repos/{repo}/releases/{rid}/assets?per_page=100') as response:
              assets = json.load(response)
          by_name = {a.get('name'): a for a in assets}
          temp = 'appsem-assembled.apk'
          with open(temp, 'wb') as output:
              for index in range(count):
                  part_name = f'appsem-part-{index:03}.bin'
                  asset = by_name.get(part_name)
                  expected = size - chunk_size * index if index == count - 1 else chunk_size
                  if not asset or asset.get('state') != 'uploaded' or asset.get('size') != expected:
                      raise ValueError(f'Parte {index + 1}/{count} ausente o incompleta')
                  start = output.tell()
                  with api(f'/repos/{repo}/releases/assets/{asset["id"]}', 'application/octet-stream') as response:
                      if 'application/json' in response.headers.get('Content-Type', ''):
                          raise ValueError('GitHub no devolvió los bytes de la parte')
                      shutil.copyfileobj(response, output, length=1024*1024)
                  if output.tell() - start != expected:
                      raise ValueError(f'Error en el tamaño recibido para la parte {index + 1}')
          if os.path.getsize(temp) != size:
              raise ValueError('El tamaño del APK ensamblado no coincide')
          with zipfile.ZipFile(temp, 'r') as archive:
              if 'AndroidManifest.xml' not in archive.namelist():
                  raise ValueError('El archivo no contiene AndroidManifest.xml')
              if archive.testzip() is not None:
                  raise ValueError('El APK contiene archivos ZIP dañados')
          os.rename(temp, file_name)
          with open('appsem-chunk-ids.txt', 'w') as ids:
              for index in range(count):
                  ids.write(str(by_name[f'appsem-part-{index:03}.bin']['id']) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('APPSEM_TAG=' + release['tag_name'] + '\n')
              env.write('APPSEM_FILE=' + file_name + '\n')
              env.write('APPSEM_SKIP=0\n')
          print(f'APK verificado: {file_name}, {size} bytes, {count} partes')
          PY

      - name: Publicar archivo APK completo en la release privada
        if: ${{ env.APPSEM_SKIP != '1' }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$APPSEM_TAG" "$APPSEM_FILE" --repo "$GITHUB_REPOSITORY"

      - name: Eliminar partes temporales y hacer pública la versión
        if: ${{ env.APPSEM_SKIP != '1' }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r asset_id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >/dev/null
          done < appsem-chunk-ids.txt
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$APPSEM_RELEASE_ID" \
            -F draft=false -f body="Distribución APK oficial de Appsem Store." >/dev/null
          echo "Release publicada: $APPSEM_TAG"

      - name: Informar de fallo de ensamblado en el borrador
        if: failure()
        shell: bash
        run: |
          original=$(gh api "repos/$GITHUB_REPOSITORY/releases/$APPSEM_RELEASE_ID" --jq '.body' || true)
          if [[ "$original" == APPSEM_CHUNKED_V1* ]]; then
            clean=$(printf '%s' "$original" | sed '/^APPSEM_ASSEMBLY_FAILED/d')
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$APPSEM_RELEASE_ID" \
              -f body="$clean"$'\nAPPSEM_ASSEMBLY_FAILED' >/dev/null || true
          fi
